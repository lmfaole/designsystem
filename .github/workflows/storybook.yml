name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      # design.lmfaole.party: the same files, on the design system's own address (`wrangler.jsonc`: a Worker with only the files, and the domain). It needs the two
      # secrets of the repository (a Cloudflare API token that may edit Workers, and the account's id); without them this step says so and the rest is as before.
      - name: Publish on design.lmfaole.party
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on the repository, so design.lmfaole.party was not updated."
          else
            npx wrangler deploy
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
